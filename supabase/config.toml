# -------------------------------------------------------------------
# Edge Functions
#
# Federation inbound functions (resources, inbox) are public endpoints
# gated by HTTP Signature (cavage) and HMAC verification respectively.
# verify_jwt = false because callers are remote FEED instances, not
# authenticated Supabase users.
#
# federation-sync and federation-webhook are cron / service-triggered;
# they authenticate via the service_role key passed as Authorization:
# Bearer in the internal caller, not by Supabase JWT.
#
# federation-health-check is a public discovery endpoint.
# -------------------------------------------------------------------

[functions.federation-resources]
verify_jwt = false

[functions.federation-inbox]
verify_jwt = false

[functions.federation-sync]
verify_jwt = false

[functions.federation-webhook]
verify_jwt = false

[functions.federation-health-check]
verify_jwt = false
